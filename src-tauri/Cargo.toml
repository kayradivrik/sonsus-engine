[package]
name = "krnl-launcher"
version = "0.1.0"
description = "Minimalist multi-platform Game Library Manager for Linux (Steam, Epic, GOG)"
authors = ["fsociecty"]
edition = "2021"

[lib]
name = "krnl_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyvalues-serde = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["process", "time", "fs", "sync", "rt-multi-thread", "macros"] }
dirs = "5"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "fs"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

