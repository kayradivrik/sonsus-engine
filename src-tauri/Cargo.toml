[package]
name = "sonsus-engine"
version = "1.0.0"
description = "Cross-platform (Linux & Windows) multi-store Game Library Manager & Extreme Linux FPS Optimizer"
authors = ["Kayra Divrik"]
edition = "2021"

[lib]
name = "sonsus_engine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyvalues-serde = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["process", "time", "fs", "sync", "rt-multi-thread", "macros", "io-util", "signal"] }
dirs = "5"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
